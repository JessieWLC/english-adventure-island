<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff7e6"><title>英文探險島｜一年級互動複習</title>
<style>
:root{--ink:#30435b;--muted:#74839a;--blue:#69b8e8;--yellow:#ffd66b;--pink:#ff9caa;--mint:#8cd9bd;--paper:#fffdf8;--line:#e6edf2;--shadow:0 14px 36px #43556c16}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff5de,#f2faff 42%,#f5fff9);color:var(--ink);font-family:ui-rounded,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}.wrap{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{font-size:42px}.brand h1{font-size:24px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}.topstats{display:flex;gap:10px}.pill{background:#fff;padding:10px 15px;border-radius:18px;box-shadow:var(--shadow);font-weight:800}.hero{display:grid;grid-template-columns:1.45fr .8fr;gap:18px;background:#fff;border-radius:28px;padding:24px;box-shadow:var(--shadow);overflow:hidden}.hero h2{font-size:28px;margin:4px 0 10px}.hero p{color:var(--muted);margin:0 0 17px;line-height:1.7}.mascots{font-size:54px;text-align:center;align-self:center;line-height:1.55;background:linear-gradient(135deg,#fff4c8,#effaff);border-radius:24px;padding:12px}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;background:var(--blue);color:#163950;box-shadow:0 4px 0 #3993c5;transition:.15s}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#fff;box-shadow:0 3px 0 #d8e2e9}.btn.pink{background:#ffb6c1;box-shadow:0 4px 0 #e58a9a}.section-head{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 12px}.section-head h2{margin:0;font-size:20px}.section-head small{color:var(--muted)}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.unit{background:#fff;border:2px solid transparent;border-radius:21px;padding:17px;box-shadow:var(--shadow);cursor:pointer;transition:.2s;position:relative}.unit:hover,.unit.active{transform:translateY(-3px);border-color:var(--blue)}.unit-icon{font-size:32px}.unit h3{margin:7px 0 3px;font-size:16px}.unit p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.unit-foot{display:flex;justify-content:space-between;margin-top:13px;font-size:12px;font-weight:800}.bar{height:8px;background:#edf2f5;border-radius:9px;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7dd8b6,#61bde8);border-radius:9px}.main{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px;margin-top:20px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:var(--shadow)}.quizhead{display:flex;justify-content:space-between;gap:8px;align-items:center}.crumb{color:var(--muted);font-size:13px}.qcount{font-weight:900;color:#5b9fc6}.question{font-size:23px;font-weight:850;line-height:1.45;margin:18px 0 7px}.hint{color:var(--muted);font-size:14px;margin-bottom:18px}.options{display:grid;gap:10px}.opt{border:2px solid var(--line);border-radius:15px;background:#fff;padding:13px 15px;text-align:left;font-size:16px;font-weight:700;transition:.15s}.opt:hover:not(:disabled){border-color:var(--blue);background:#f4fbff}.opt.correct{border-color:#5cce9d;background:#edfff5}.opt.wrong{border-color:#ff9ba8;background:#fff2f3}.feedback{margin-top:16px;padding:16px;border-radius:17px;background:#f3fbff;line-height:1.65}.feedback.good{background:#edfff5}.feedback.bad{background:#fff5e9}.feedback h4{margin:0 0 6px}.feedback p{margin:5px 0}.whywrong{font-size:13px;color:#6c6470}.quizactions{display:flex;justify-content:space-between;gap:8px;margin-top:17px}.side h3{margin:0 0 12px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px;border-radius:15px;background:#f5faff}.stat b{display:block;font-size:21px}.stat small{color:var(--muted)}.side .bar{margin:12px 0 16px}.badge{padding:11px;background:#fff9df;border-radius:14px;margin-top:10px;font-size:13px}.mistake-list{max-height:300px;overflow:auto}.mistake{font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}.empty{color:var(--muted);font-size:13px;line-height:1.6}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#30435b;color:white;padding:12px 18px;border-radius:16px;display:none;box-shadow:var(--shadow);z-index:5}.footer{text-align:center;padding:24px;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:#20334d77;display:none;place-items:center;padding:16px;z-index:4}.modalbox{background:white;border-radius:24px;padding:24px;max-width:600px;width:100%;max-height:85vh;overflow:auto}.modalbox h2{margin-top:0}.close{float:right;border:0;background:#edf3f7;border-radius:9px;padding:7px 11px}.spark{color:#f6b820}
@media(max-width:850px){.main{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.units{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.wrap{padding:13px}.top{align-items:flex-start}.topstats{gap:5px}.pill{padding:8px 10px;font-size:12px}.brand h1{font-size:19px}.logo{font-size:34px}.hero{grid-template-columns:1fr;padding:18px}.hero h2{font-size:23px}.mascots{font-size:39px}.units{grid-template-columns:1fr 1fr;gap:9px}.unit{padding:12px}.unit h3{font-size:14px}.unit p{font-size:11px}.unit-foot{font-size:10px}.card{padding:16px}.question{font-size:20px}.side{grid-template-columns:1fr}.quizactions .btn{padding:11px;font-size:13px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><div class="logo">🏝️</div><div><h1>英文探險島</h1><p>小小英語家，今天也來闖關！</p></div></div><div class="topstats"><div class="pill">⭐ <span id="topStars">0</span></div><div class="pill">🔥 <span id="topDone">0</span> 題</div></div></header>
<section class="hero"><div><h2>嗨！準備好出發了嗎？ 🐯</h2><p>和動物朋友一起複習英文。每答對一題就能收集星星，遇到不會的也沒關係，看看解說再挑戰一次！</p><button class="btn" onclick="startUnit(0)">開始今日挑戰　➜</button> <button class="btn secondary" onclick="openMistakes()">📒 我的錯題本</button></div><div class="mascots">🦊　🐼<br>🐸　🐰　🐻</div></section>
<div class="section-head"><h2>🗺️ 選擇探險關卡</h2><small>每關 20 題・共 120 題</small></div><section class="units" id="units"></section>
<section class="main"><div class="card" id="quiz"><div class="empty" style="text-align:center;padding:38px 8px"><div style="font-size:54px">🦉</div><h2>選一個關卡開始吧！</h2><p>答題後會立刻看到正確答案、中文說明和錯誤選項分析。</p></div></div><aside class="side"><div class="card"><h3>🏆 我的學習成績</h3><div class="statgrid"><div class="stat"><b id="statScore">0</b><small>累積星星</small></div><div class="stat"><b id="statRate">—</b><small>答對率</small></div><div class="stat"><b id="statAnswered">0</b><small>作答題數</small></div><div class="stat"><b id="statMastered">0/120</b><small>完成題目</small></div></div><div class="bar"><i id="overallBar" style="width:0%"></i></div><div id="badges"></div></div><div class="card"><h3>📒 錯題練習</h3><div id="mistakeSummary" class="empty">答錯的題目會收進這裡，複習後可重新挑戰。</div><button class="btn pink" style="width:100%;margin-top:12px" onclick="startMistakes()">重新練習錯題</button></div></aside></section>
<div class="footer">🌈 每天練一點，英文進步看得見！學習紀錄只存在這台裝置的瀏覽器中。</div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">關閉 ✕</button><div id="modalContent"></div></div></div>
<script src="./app.js?v=6" defer></script></body></html>
